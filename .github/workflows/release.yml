name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # One platform failing should not deny everyone else a download.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 (Intel) runners are retired, so x86_64 is cross-compiled from arm64.
          # CMakeLists already defaults CMAKE_OSX_ARCHITECTURES to "arm64;x86_64".
          - name: macOS universal
            os: macos-15
            artefact: macos-universal

          - name: Windows x64
            os: windows-latest
            artefact: windows-x64
            cmake_args: -A x64

          # Cross-compiled from an x64 host. JUCE has to build its juceaide helper for the
          # host first, which is the usual place a Windows-on-ARM build falls over, so this
          # one is allowed to fail without taking the release with it.
          - name: Windows arm64
            os: windows-latest
            artefact: windows-arm64
            cmake_args: -A ARM64
            experimental: true
            skip_tests: true

          # 22.04 rather than latest: the binary then runs on anything with glibc 2.35 or
          # newer, instead of only on very recent distributions.
          - name: Linux x64
            os: ubuntu-22.04
            artefact: linux-x64

          - name: Linux arm64
            os: ubuntu-22.04-arm
            artefact: linux-arm64
            experimental: true

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev \
            libcurl4-openssl-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run engine tests
        if: ${{ ! matrix.skip_tests }}
        shell: bash
        run: |
          BIN=$(find build -type f \( -name 'SimpleCueTests' -o -name 'SimpleCueTests.exe' \) | head -1)
          echo "running $BIN"
          "$BIN"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build/SimpleCue_artefacts/Release
          cp "$GITHUB_WORKSPACE/README.md" "$GITHUB_WORKSPACE/LICENSE" .
          # ditto keeps the bundle's symlinks and resource forks intact; plain zip does not.
          ditto -c -k --sequesterRsrc --keepParent "SimpleCue.app" "$GITHUB_WORKSPACE/simplecue-${{ matrix.artefact }}.zip"
          zip -j "$GITHUB_WORKSPACE/simplecue-${{ matrix.artefact }}.zip" README.md LICENSE

      - name: Installers (macOS)
        if: runner.os == 'macOS'
        shell: bash
        # A zip of a .app is not an install experience. Ship a .dmg and a .pkg
        # too, using the same helper the local release script uses so the CI
        # and local artefacts are identical.
        #
        # The ad-hoc signature is not cosmetic: arm64 binaries come out of the
        # linker already signed, x86_64 ones do not, and a completely unsigned
        # bundle is refused with "is damaged and can't be opened".
        run: |
          source scripts/release-lib.sh
          # On a workflow_dispatch GITHUB_REF_NAME is the branch ("main"), not a
          # tag — which is how v0.3.1 first shipped installers called
          # simplecue-main-*. Prefer the dispatch input, and only accept a ref
          # name that actually looks like a version.
          version="${{ github.event.inputs.tag || github.ref_name }}"
          version="${version#v}"
          case "$version" in
            [0-9]*) ;;
            *) version="$(sed -n 's/^project(SimpleCue VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" ;;
          esac
          rl_init "SimpleCue" simplecue "$version" com.stoatworks.simplecue "$GITHUB_WORKSPACE"
          stage="$RUNNER_TEMP/stage-mac"
          rm -rf "$stage"; mkdir -p "$stage"
          cp -R build/SimpleCue_artefacts/Release/SimpleCue.app "$stage/"
          cp README.md LICENSE "$stage/"
          # Trust lipo, not the build log: a mis-ordered CMAKE_OSX_ARCHITECTURES
          # yields a single-arch binary that still reports success.
          archs="$(lipo -archs "$stage/SimpleCue.app/Contents/MacOS/SimpleCue")"
          echo "SimpleCue.app: $archs"
          case "$archs" in *arm64*x86_64*|*x86_64*arm64*) ;; *)
            echo "expected a universal binary, got: $archs" >&2; exit 1 ;;
          esac
          rl_adhoc_sign "$stage/SimpleCue.app"
          rl_dmg "${{ matrix.artefact }}" "$stage" --app "SimpleCue.app"
          rl_pkg "${{ matrix.artefact }}" "$stage" --app "SimpleCue.app"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "build/SimpleCue_artefacts/Release"
          Copy-Item README.md, LICENSE $dir
          Compress-Archive -Path "$dir/*" -DestinationPath "simplecue-${{ matrix.artefact }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build/SimpleCue_artefacts/Release
          cp "$GITHUB_WORKSPACE/README.md" "$GITHUB_WORKSPACE/LICENSE" .
          tar czf "$GITHUB_WORKSPACE/simplecue-${{ matrix.artefact }}.tar.gz" SimpleCue README.md LICENSE

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: simplecue-${{ matrix.artefact }}
          path: |
            simplecue-*.zip
            simplecue-*.tar.gz
            simplecue-*.dmg
            simplecue-*.pkg
          if-no-files-found: error

  windows-installers:
    name: Windows installers
    needs: build
    runs-on: ubuntu-latest
    # NSIS is a cross-compiler: makensis produces the same installer wherever it
    # runs. Doing both architectures in one Linux job keeps them identical and
    # avoids depending on whatever NSIS happens to be present on the Windows
    # images (the arm64 image in particular cannot run the 32-bit makensis).
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build installers
        shell: bash
        run: |
          source scripts/release-lib.sh
          version="${{ github.event.inputs.tag || github.ref_name }}"
          version="${version#v}"
          case "$version" in
            [0-9]*) ;;
            *) version="$(sed -n 's/^project(SimpleCue VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" ;;
          esac
          rl_init "SimpleCue" simplecue "$version" com.stoatworks.simplecue "$PWD/installers"
          for arch in x64 arm64; do
            zip="$(find artifacts -name "simplecue-windows-${arch}.zip" | head -1)"
            if [ -z "$zip" ]; then
              echo "no build artefact for windows-${arch}, skipping"
              continue
            fi
            stage="$RUNNER_TEMP/stage-${arch}"
            rm -rf "$stage"; mkdir -p "$stage"
            unzip -q "$zip" -d "$stage"
            rl_nsis "windows-${arch}" "$stage" --gui "SimpleCue.exe"
          done
          ls -l installers

      - uses: actions/upload-artifact@v7
        with:
          name: simplecue-windows-installers
          path: installers/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [build, windows-installers]
    runs-on: ubuntu-latest
    # Runs even if an experimental platform dropped out, so the rest still ship.
    if: always()
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artefacts
          merge-multiple: true

      - name: List what we have
        run: ls -la artefacts

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            artefacts/simplecue-*.zip
            artefacts/simplecue-*.tar.gz
            artefacts/simplecue-*.dmg
            artefacts/simplecue-*.pkg
            artefacts/simplecue-*-setup.exe
          body: |
            **macOS** — `.pkg` installs SimpleCue into /Applications; `.dmg` lets you drag it
            yourself; the `.zip` is the bare app. All three are universal (Intel + Apple Silicon).

            **Windows** — `-setup.exe` installs with Start Menu and Desktop shortcuts and an
            Add/Remove Programs entry; the `.zip` is portable.

            **Linux** — portable `.tar.gz`.

            Builds are unsigned.

            **macOS** — the app is not notarised, so Gatekeeper will refuse it on first
            open. Either right-click the app and choose Open, or clear the quarantine flag:

            ```
            xattr -dr com.apple.quarantine "/Applications/SimpleCue.app"
            ```

            **Windows** — SmartScreen will warn on first run: More info, then Run anyway.
            ASIO is not included, because Steinberg's licence forbids redistributing the
            SDK; these builds have WASAPI (shared and exclusive) and DirectSound. To get
            ASIO, build from source with `-DSIMPLECUE_ASIO_SDK_PATH=<path to the SDK>`.

            **Linux** — built against glibc 2.35 (Ubuntu 22.04) with ALSA and JACK. PipeWire
            works through its ALSA and JACK compatibility layers.

            No MIDI, lighting or streaming hardware has been connected to this software yet.
            See the README for what is and is not verified.
