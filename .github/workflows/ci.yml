name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 (Intel) runners are retired, so x86_64 is cross-compiled here.
          # No arch flag: CMakeLists already defaults to "arm64;x86_64" on Apple, and
          # passing it on the command line would split the shell at the semicolon.
          - name: macOS (universal)
            os: macos-15
            cmake_args: ""
          - name: Linux (ALSA + JACK)
            os: ubuntu-latest
            cmake_args: ""
          - name: Windows (WASAPI + DirectSound)
            os: windows-latest
            cmake_args: ""

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev \
            libcurl4-openssl-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run engine tests
        shell: bash
        run: |
          # The binary lands in a per-config folder on multi-config generators and a flat
          # one otherwise, so find it rather than guessing. Match the exact names: a
          # trailing wildcard also picks up JUCE's generated SimpleCueTests.entitlements.
          BIN=$(find build -type f \( -name 'SimpleCueTests' -o -name 'SimpleCueTests.exe' \) | head -1)
          echo "running $BIN"
          "$BIN"
